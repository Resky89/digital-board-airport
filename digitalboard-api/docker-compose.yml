version: "3.8"

services:
  app:
    build: .
    container_name: digitalboard-api
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
    environment:
      DB_CONNECTION: mysql
      DB_HOST: airport-mysql
      DB_PORT: 3306
      DB_DATABASE: airport_db
      DB_USERNAME: airport_user
      DB_PASSWORD: user123
    command: php-fpm
    networks:
      - airport_net

  nginx:
    image: nginx:stable-alpine
    container_name: digitalboard-api-nginx
    restart: unless-stopped
    depends_on:
      - app
    volumes:
      - ./:/var/www/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - airport_net

networks:
  airport_net:
    external: true
    name: airport_net
