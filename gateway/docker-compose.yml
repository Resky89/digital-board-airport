version: "3.8"

services:
  gateway:
    image: nginx:stable-alpine
    container_name: airport-gateway
    restart: unless-stopped
    ports:
      - "8082:80"
      - "8443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./cert:/etc/nginx/certs:ro
    networks:
      - airport_net

networks:
  airport_net:
    external: true
    name: airport_net
